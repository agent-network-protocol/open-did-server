# 站点示例。证书路径换成实际文件。上游是本机 Open DID Server。
# 配套环境：LOCAL_DEMO_MODE=0、REQUEST_BASE_URL=https://did.example.test、
# TRUSTED_PROXY_CIDRS=127.0.0.1/32。
# 只转发这一组头。重复或残缺的 X-Forwarded-Proto / X-Forwarded-Host 会被服务拒绝。

server {
    listen 443 ssl;
    server_name did.example.test;

    ssl_certificate     /etc/ssl/certs/did.example.test.crt;
    ssl_certificate_key /etc/ssl/private/did.example.test.key;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host $host;
    }
}
